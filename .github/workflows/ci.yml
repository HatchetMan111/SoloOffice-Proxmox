name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Syntax und ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck installieren
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Statische Prüfungen
        run: bash tests/static-checks.sh
